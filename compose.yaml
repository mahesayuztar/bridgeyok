name: bridgeyok

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bridgeyok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bridgeyok}
      POSTGRES_USER: ${POSTGRES_USER:-bridgeyok}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
