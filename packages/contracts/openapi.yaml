openapi: 3.1.0
info:
  title: BridgeYok HTTP API
  version: 0.1.0
  description: Public HTTP contract for the BridgeYok service foundation.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /v1/account/signup:
    post:
      operationId: registerAccount
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLogin'
        default:
          description: Account operation rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSignupRequest'
  /v1/account/login:
    post:
      operationId: loginAccount
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLogin'
        default:
          description: Account operation rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLoginRequest'
  /v1/account:
    get:
      operationId: getCurrentAccount
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLogin'
        default:
          description: Account operation rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/account/logout:
    post:
      operationId: logoutAccount
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Successful operation
        default:
          description: Account operation rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/account/heartbeat:
    post:
      operationId: heartbeatAccount
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Successful operation
        default:
          description: Account operation rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/account/profile:
    put:
      operationId: updateAccountProfile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        default:
          description: Account operation rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProfileUpdate'
  /v1/account/users:
    get:
      operationId: searchAccountUsers
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                maxItems: 30
                items:
                  $ref: '#/components/schemas/AccountProfile'
        default:
          description: Account operation rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 96
      - name: friends
        in: query
        schema:
          type: boolean
  /v1/account/users/{userId}/follow:
    put:
      operationId: followAccountUser
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Successful operation
        default:
          description: Account operation rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: unfollowAccountUser
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Successful operation
        default:
          description: Account operation rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/account/tables/{tableId}/participants:
    get:
      operationId: getTableAccountProfiles
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountProfile'
        default:
          description: Account operation rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: tableId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/account/tables/{tableId}/invites:
    post:
      operationId: inviteAccountPlayer
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Successful operation
        default:
          description: Account operation rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerInviteRequest'
      parameters:
      - name: tableId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/account/chat:
    get:
      operationId: getChatHistory
      description: Current mutual Friends or active table participants only. Expired messages are excluded before cleanup. Newest-first keyset pagination; no gameplay revision.
      security:
      - bearerAuth: []
      parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
          enum: [private, table]
      - name: id
        in: query
        required: true
        description: Friend user UUID for private chat, table UUID for table chat.
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 512
      responses:
        '200':
          description: Retained messages, up to 50 per page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPage'
        default:
          description: Invalid request, unauthenticated account, or forbidden conversation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/account/invitations:
    get:
      deprecated: true
      description: Compatibility endpoint always returns an empty array. Invitations are realtime-only.
      operationId: listPlayerInvitations
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/PlayerInvitation'
        default:
          description: Account operation rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /:
    get:
      operationId: getServiceInfo
      summary: Get API service information
      responses:
        "200":
          description: API is serving requests
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: bridgeyok-api
  /health/live:
    get:
      operationId: getLiveness
      summary: Check process liveness
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: api
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check database and migration readiness
      responses:
        "200":
          description: API dependencies are ready
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ready
                service: api
        "503":
          description: A required dependency is unavailable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: unavailable
                service: api
  /v1/guest-sessions:
    post:
      operationId: createGuestSession
      summary: Create a device-scoped guest session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestSessionRequest"
      responses:
        "201":
          description: Guest session created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestCredentials"
        "400":
          $ref: "#/components/responses/ProblemResponse"
  /v1/guest-sessions/refresh:
    post:
      operationId: refreshGuestSession
      summary: Rotate a device credential and issue fresh access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshGuestSessionRequest"
      responses:
        "200":
          description: Guest credentials rotated
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestCredentials"
        "401":
          $ref: "#/components/responses/ProblemResponse"
  /v1/guest-sessions/current:
    delete:
      operationId: revokeGuestSession
      summary: Revoke the authenticated guest session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Guest session revoked
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables:
    post:
      operationId: createTable
      summary: Create a private waiting table
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Table created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTableResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables/{inviteCode}/preview:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    get:
      operationId: previewTable
      summary: Preview a private invite without joining
      responses:
        "200":
          description: Non-identifying table preview
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TablePreview"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables/{inviteCode}/join:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    post:
      operationId: joinTable
      summary: Join an available private table
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Participant joined or existing participation resumed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables/{tableId}:
    parameters:
      - $ref: "#/components/parameters/TableId"
    get:
      operationId: getTable
      summary: Get recipient-projected table state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorized table state
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables/{tableId}/leave:
    parameters:
      - $ref: "#/components/parameters/TableId"
    post:
      operationId: leaveTable
      summary: Leave a waiting table and release its seat
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Participant left the table
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /v1/realtime/tickets:
    post:
      operationId: createRealtimeTicket
      summary: Issue a single-use WebSocket ticket
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Realtime ticket issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTicket"
        "401":
          $ref: "#/components/responses/ProblemResponse"
  /v1/boards/{boardId}/analysis:
    get:
      operationId: analyzeCompletedBoard
      summary: Analyze a deal or a legal card position for a table participant
      description: Read-only DDS. Without positionKey, analyzes a completed original deal. With positionKey, analyzes the live revision or historical card count selected by step. Results count total tricks for the side to play. No client-supplied deal is accepted.
      security:
        - bearerAuth: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: positionKey
          in: query
          description: Live table revision as a decimal string, or replay request identity when step is present.
          schema:
            type: string
        - name: step
          in: query
          description: Number of played cards in a completed board, requires positionKey.
          schema:
            type: integer
            minimum: 0
            maximum: 52
      responses:
        "200":
          description: Dealer-aware double-dummy analysis
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BoardAnalysis"
                  - $ref: "#/components/schemas/PositionAnalysis"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        "504":
          $ref: "#/components/responses/ProblemResponse"

  /v1/boards/{boardId}/replay:
    get:
      operationId: getCompletedBoardReplay
      summary: Replay a completed board for an active table participant
      description: Returns the original deal and final authoritative engine state. Archived
        records are replayed and hash-validated. A scored current board uses its consistent
        private snapshot. Old boards without an archive or matching snapshot return
        404. Undo-reversed actions are excluded; claims never synthesize tricks.
      security:
      - bearerAuth: []
      parameters:
      - name: boardId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Completed board replay
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardReplay'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  headers:
    RequestId:
      description: Correlation identifier for the request.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9_-]+$"
  parameters:
    InviteCode:
      name: inviteCode
      in: path
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26
        pattern: "^[A-Za-z2-7]+$"
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ProblemResponse:
      description: The request was rejected
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    AccountProfile:
      type: object
      additionalProperties: false
      required:
      - id
      - username
      - displayName
      - avatar
      - online
      - following
      - friends
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: ^[a-z0-9_]{3,24}$
        displayName:
          type: string
        avatar: &id001
          type: string
          enum:
          - spade
          - heart
          - diamond
          - club
          - owl
          - fox
        online:
          type: boolean
        following:
          type: boolean
        friends:
          type: boolean
        participantId:
          type: string
          format: uuid
    AccountLogin:
      type: object
      additionalProperties: false
      required:
      - profile
      - token
      - expiresAt
      - sessionId
      properties:
        profile:
          $ref: '#/components/schemas/AccountProfile'
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
    AccountSignupRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      - displayName
      - avatar
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
        password:
          type: string
          minLength: 10
          maxLength: 128
        displayName:
          type: string
          minLength: 2
          maxLength: 24
        avatar: *id001
    AccountLoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          maxLength: 128
    AccountProfileUpdate:
      type: object
      additionalProperties: false
      required:
      - displayName
      - avatar
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 24
        avatar: *id001
    PlayerInviteRequest:
      type: object
      additionalProperties: false
      required:
      - userId
      - inviteCode
      properties:
        userId:
          type: string
          format: uuid
        inviteCode:
          type: string
          pattern: ^[A-Z2-7]{26}$
    ChatMessage:
      type: object
      additionalProperties: false
      required: [messageId, scope, conversationId, senderUserId, sender, content, clientRequestId, createdAt]
      properties:
        messageId:
          type: string
          format: uuid
        scope:
          type: string
          enum: [private, table]
        conversationId:
          type: string
        senderUserId:
          type: string
          format: uuid
        sender:
          $ref: '#/components/schemas/AccountProfile'
        content:
          type: string
          description: Up to 1000 grapheme clusters and 16000 UTF-8 bytes, never truncated.
        clientRequestId:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
        createdAt:
          type: string
          format: date-time
    ChatPage:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ChatMessage'
        nextCursor:
          type: string
    PlayerInvitation:
      type: object
      additionalProperties: false
      required:
      - sender
      - tableId
      - inviteCode
      - expiresAt
      properties:
        sender:
          $ref: '#/components/schemas/AccountProfile'
        tableId:
          type: string
          format: uuid
        inviteCode:
          type: string
        expiresAt:
          type: string
          format: date-time
    ReplayCard:
      type: object
      additionalProperties: false
      required:
      - suit
      - rank
      properties:
        suit:
          enum:
          - C
          - D
          - H
          - S
          type: string
        rank:
          enum:
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - '8'
          - '9'
          - T
          - J
          - Q
          - K
          - A
          type: string
    ReplayCall:
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - PASS
          - BID
          - DOUBLE
          - REDOUBLE
        level:
          type: integer
          minimum: 1
          maximum: 7
        strain:
          type: string
          enum:
          - C
          - D
          - H
          - S
          - NT
    ReplayContract:
      type: object
      additionalProperties: false
      required:
      - level
      - strain
      - doubling
      - declarer
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 7
        strain:
          enum:
          - C
          - D
          - H
          - S
          - NT
          type: string
        doubling:
          enum:
          - UNDOUBLED
          - DOUBLED
          - REDOUBLED
          type: string
        declarer:
          enum:
          - N
          - E
          - S
          - W
          type: string
    ReplayResult:
      type: object
      additionalProperties: false
      required:
      - rulesetVersion
      - passedOut
      - tricksDeclarer
      - tricksNS
      - tricksEW
      - vulnerability
      - scoreNS
      properties:
        rulesetVersion:
          type: string
          minLength: 1
        passedOut:
          type: boolean
        contract:
          $ref: '#/components/schemas/ReplayContract'
        tricksDeclarer:
          type: integer
          minimum: 0
          maximum: 13
        tricksNS:
          type: integer
          minimum: 0
          maximum: 13
        tricksEW:
          type: integer
          minimum: 0
          maximum: 13
        vulnerability:
          enum:
          - NONE
          - NS
          - EW
          - BOTH
          type: string
        scoreNS:
          type: integer
    ReplayDeal:
      type: object
      additionalProperties: false
      required:
      - north
      - east
      - south
      - west
      properties:
        north:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReplayCard'
        east:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReplayCard'
        south:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReplayCard'
        west:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReplayCard'
    ReplayTrick:
      type: object
      additionalProperties: false
      required:
      - leader
      - plays
      properties:
        leader:
          type: string
          enum:
          - ''
          - N
          - E
          - S
          - W
        plays:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties: false
            required:
            - seat
            - card
            properties:
              seat:
                $ref: '#/components/schemas/TableSeat'
              card:
                $ref: '#/components/schemas/ReplayCard'
        winner:
          $ref: '#/components/schemas/TableSeat'
    ReplayAuction:
      type: object
      additionalProperties: false
      required:
      - dealer
      - calls
      - complete
      - passedOut
      properties:
        dealer:
          $ref: '#/components/schemas/TableSeat'
        turn:
          $ref: '#/components/schemas/TableSeat'
        calls:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - seat
            - call
            properties:
              seat:
                $ref: '#/components/schemas/TableSeat'
              call:
                $ref: '#/components/schemas/ReplayCall'
        complete:
          type: boolean
        passedOut:
          type: boolean
        contract:
          $ref: '#/components/schemas/ReplayContract'
    ReplayGame:
      type: object
      additionalProperties: false
      required:
      - rulesetVersion
      - board
      - phase
      - deal
      - auction
      - dummyRevealed
      - currentTrick
      - completedTricks
      - tricksNS
      - tricksEW
      - result
      - claimed
      properties:
        rulesetVersion:
          type: string
        board:
          type: object
          additionalProperties: false
          required:
          - number
          - dealer
          - vulnerability
          properties:
            number:
              type: integer
            dealer:
              $ref: '#/components/schemas/TableSeat'
            vulnerability:
              type: string
              enum:
              - NONE
              - NS
              - EW
              - BOTH
        phase:
          type: string
          enum:
          - BOARD_SCORED
        deal:
          $ref: '#/components/schemas/ReplayDeal'
        auction:
          $ref: '#/components/schemas/ReplayAuction'
        turn:
          $ref: '#/components/schemas/TableSeat'
        dummyRevealed:
          type: boolean
        currentTrick:
          $ref: '#/components/schemas/ReplayTrick'
        completedTricks:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReplayTrick'
        tricksNS:
          $ref: '#/components/schemas/AnalysisTricks'
        tricksEW:
          $ref: '#/components/schemas/AnalysisTricks'
        result:
          $ref: '#/components/schemas/ReplayResult'
        claimed:
          type: boolean
    BoardReplay:
      type: object
      additionalProperties: false
      required:
      - boardId
      - fullDeal
      - game
      properties:
        boardId:
          type: string
          format: uuid
        fullDeal:
          $ref: '#/components/schemas/ReplayDeal'
        game:
          $ref: '#/components/schemas/ReplayGame'
    AnalysisStrain:
      type: string
      enum: [C, D, H, S, NT]
    AnalysisTricks:
      type: integer
      minimum: 0
      maximum: 13
    AnalysisHand:
      type: object
      additionalProperties: false
      required: [C, D, H, S, NT]
      properties:
        C:
          $ref: "#/components/schemas/AnalysisTricks"
        D:
          $ref: "#/components/schemas/AnalysisTricks"
        H:
          $ref: "#/components/schemas/AnalysisTricks"
        S:
          $ref: "#/components/schemas/AnalysisTricks"
        NT:
          $ref: "#/components/schemas/AnalysisTricks"
    AnalysisResult:
      type: object
      additionalProperties: false
      required: [solverVersion, doubleDummyTable, makeableContracts, par]
      properties:
        solverVersion:
          type: string
          const: dds-2.9.0-8d75755
        doubleDummyTable:
          type: object
          additionalProperties: false
          required: [N, E, S, W]
          properties:
            N:
              $ref: "#/components/schemas/AnalysisHand"
            E:
              $ref: "#/components/schemas/AnalysisHand"
            S:
              $ref: "#/components/schemas/AnalysisHand"
            W:
              $ref: "#/components/schemas/AnalysisHand"
        makeableContracts:
          type: array
          maxItems: 20
          description: Maximum makeable undoubled level for each declarer and strain that can take at least seven tricks.
          items:
            type: object
            additionalProperties: false
            required: [declarer, strain, level]
            properties:
              declarer:
                $ref: "#/components/schemas/TableSeat"
              strain:
                $ref: "#/components/schemas/AnalysisStrain"
              level:
                type: integer
                minimum: 1
                maximum: 7
        par:
          type: object
          additionalProperties: false
          required: [scoreNS, contracts]
          properties:
            scoreNS:
              type: integer
              minimum: -7600
              maximum: 7600
            contracts:
              type: array
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                required: [declarers, strain, level, overTricks, underTricks, doubled]
                properties:
                  declarers:
                    type: array
                    minItems: 1
                    maxItems: 2
                    uniqueItems: true
                    items:
                      $ref: "#/components/schemas/TableSeat"
                  strain:
                    $ref: "#/components/schemas/AnalysisStrain"
                  level:
                    type: integer
                    minimum: 1
                    maximum: 7
                  overTricks:
                    type: integer
                    minimum: 0
                    maximum: 6
                  underTricks:
                    type: integer
                    minimum: 0
                    maximum: 13
                  doubled:
                    type: boolean
    PositionAnalysis:
      type: object
      required: [boardId, positionKey, turn, cards]
      properties:
        boardId:
          type: string
          format: uuid
        positionKey:
          type: string
        turn:
          $ref: "#/components/schemas/TableSeat"
        cards:
          type: array
          maxItems: 13
          items:
            type: object
            required: [card, tricks]
            properties:
              card:
                $ref: "#/components/schemas/ReplayCard"
              tricks:
                type: integer
                minimum: 0
                maximum: 13
    BoardAnalysis:
      type: object
      additionalProperties: false
      required: [boardId, metadata, provenance, analysis]
      properties:
        boardId:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: false
          required: [number, dealer, vulnerability]
          properties:
            number:
              type: integer
              minimum: 1
            dealer:
              $ref: "#/components/schemas/TableSeat"
            vulnerability:
              type: string
              enum: [NONE, NS, EW, BOTH]
        provenance:
          type: object
          additionalProperties: false
          required: [type, version]
          properties:
            type:
              type: string
              enum: [secure_random, deterministic, prepared, constraint]
            version:
              type: string
              minLength: 1
              maxLength: 64
            reference:
              type: string
              format: uuid
        analysis:
          $ref: "#/components/schemas/AnalysisResult"
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
            - ready
            - unavailable
        service:
          type: string
          minLength: 1
          maxLength: 64
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 160
        status:
          type: integer
          minimum: 400
          maximum: 599
        requestId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Z][A-Z0-9_]*$"
        messageKey:
          type: string
          minLength: 1
          maxLength: 128
        retryable:
          type: boolean
    CreateGuestSessionRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 128
    RefreshGuestSessionRequest:
      type: object
      additionalProperties: false
      required:
        - deviceCredential
      properties:
        deviceCredential:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]+$"
    GuestCredentials:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - nickname
        - accessToken
        - accessExpiresAt
        - deviceCredential
      properties:
        sessionId:
          type: string
          format: uuid
        nickname:
          type: string
        accessToken:
          type: string
          minLength: 32
        accessExpiresAt:
          type: string
          format: date-time
        deviceCredential:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]+$"
    RealtimeTicket:
      type: object
      additionalProperties: false
      required:
        - ticket
        - expiresAt
      properties:
        ticket:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]+$"
        expiresAt:
          type: string
          format: date-time
    TableState:
      type: string
      enum:
        - WAITING
        - ACTIVE
        - BETWEEN_BOARDS
        - FINISHED
        - PAUSED
    TableRole:
      type: string
      enum:
        - OWNER
        - PARTICIPANT
    TableSeat:
      type: string
      enum:
        - N
        - E
        - S
        - W
    TableParticipant:
      type: object
      additionalProperties: false
      required:
        - id
        - nickname
        - role
        - isBot
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
          minLength: 2
          maxLength: 64
        role:
          $ref: "#/components/schemas/TableRole"
        isBot:
          type: boolean
    TableSeatAssignment:
      type: object
      additionalProperties: false
      required:
        - participantId
