        - controllerEpoch
      properties:
        participantId:
          type: string
          format: uuid
        ready:
          type: boolean
        controllerEpoch:
          type: integer
          format: int64
          minimum: 1
        isBot:
          type: boolean
    TableView:
      type: object
      additionalProperties: false
      required:
        - tableId
        - state
        - locked
        - revision
        - lastSeq
        - boardNumber
        - viewerParticipantId
        - viewerRole
        - participants
        - seats
      properties:
        tableId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/TableState"
        locked:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 0
        lastSeq:
          type: integer
          format: int64
          minimum: 0
        boardId:
          type: string
          format: uuid
        boardNumber:
          type: integer
          minimum: 0
        viewerParticipantId:
          type: string
          format: uuid
        viewerRole:
          $ref: "#/components/schemas/TableRole"
        viewerSeat:
          $ref: "#/components/schemas/TableSeat"
        participants:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/TableParticipant"
        seats:
          type: object
          maxProperties: 4
