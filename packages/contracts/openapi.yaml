openapi: 3.1.0
info:
  title: BridgeYok HTTP API
  version: 0.1.0
  description: Public HTTP contract for the BridgeYok service foundation.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /:
    get:
      operationId: getServiceInfo
      summary: Get API service information
      responses:
        "200":
          description: API is serving requests
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: bridgeyok-api
  /health/live:
    get:
      operationId: getLiveness
      summary: Check process liveness
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: api
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check database and migration readiness
      responses:
        "200":
          description: API dependencies are ready
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ready
                service: api
        "503":
          description: A required dependency is unavailable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: unavailable
                service: api
  /v1/guest-sessions:
    post:
      operationId: createGuestSession
      summary: Create a device-scoped guest session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestSessionRequest"
      responses:
        "201":
          description: Guest session created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestCredentials"
        "400":
          $ref: "#/components/responses/ProblemResponse"
  /v1/guest-sessions/refresh:
    post:
      operationId: refreshGuestSession
      summary: Rotate a device credential and issue fresh access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshGuestSessionRequest"
      responses:
        "200":
          description: Guest credentials rotated
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestCredentials"
        "401":
          $ref: "#/components/responses/ProblemResponse"
  /v1/guest-sessions/current:
    delete:
      operationId: revokeGuestSession
      summary: Revoke the authenticated guest session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Guest session revoked
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables:
    post:
      operationId: createTable
      summary: Create a private waiting table
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Table created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTableResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables/{inviteCode}/preview:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    get:
      operationId: previewTable
      summary: Preview a private invite without joining
      responses:
        "200":
          description: Non-identifying table preview
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TablePreview"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables/{inviteCode}/join:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    post:
      operationId: joinTable
      summary: Join an available private table
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Participant joined or existing participation resumed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables/{tableId}:
    parameters:
      - $ref: "#/components/parameters/TableId"
    get:
      operationId: getTable
      summary: Get recipient-projected table state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorized table state
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables/{tableId}/leave:
    parameters:
      - $ref: "#/components/parameters/TableId"
    post:
      operationId: leaveTable
      summary: Leave a waiting table and release its seat
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Participant left the table
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /v1/realtime/tickets:
    post:
      operationId: createRealtimeTicket
      summary: Issue a single-use WebSocket ticket
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Realtime ticket issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTicket"
        "401":
          $ref: "#/components/responses/ProblemResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  headers:
    RequestId:
      description: Correlation identifier for the request.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9_-]+$"
  parameters:
    InviteCode:
      name: inviteCode
      in: path
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26
        pattern: "^[A-Za-z2-7]+$"
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ProblemResponse:
      description: The request was rejected
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
            - ready
            - unavailable
        service:
          type: string
          minLength: 1
          maxLength: 64
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 160
        status:
          type: integer
          minimum: 400
          maximum: 599
        requestId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Z][A-Z0-9_]*$"
        messageKey:
          type: string
          minLength: 1
          maxLength: 128
        retryable:
          type: boolean
    CreateGuestSessionRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 128
    RefreshGuestSessionRequest:
      type: object
      additionalProperties: false
      required:
        - deviceCredential
      properties:
        deviceCredential:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]+$"
    GuestCredentials:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - nickname
        - accessToken
        - accessExpiresAt
        - deviceCredential
      properties:
        sessionId:
          type: string
          format: uuid
        nickname:
          type: string
        accessToken:
          type: string
          minLength: 32
        accessExpiresAt:
          type: string
          format: date-time
        deviceCredential:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]+$"
    RealtimeTicket:
      type: object
      additionalProperties: false
      required:
        - ticket
        - expiresAt
      properties:
        ticket:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]+$"
        expiresAt:
          type: string
          format: date-time
    TableState:
      type: string
      enum:
        - WAITING
        - ACTIVE
        - BETWEEN_BOARDS
        - FINISHED
        - PAUSED
    TableRole:
      type: string
      enum:
        - OWNER
        - PARTICIPANT
    TableSeat:
      type: string
      enum:
        - N
        - E
        - S
        - W
    TableParticipant:
      type: object
      additionalProperties: false
      required:
        - id
        - nickname
        - role
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
          minLength: 2
          maxLength: 64
        role:
          $ref: "#/components/schemas/TableRole"
    TableSeatAssignment:
      type: object
      additionalProperties: false
      required:
        - participantId
        - ready
        - controllerEpoch
      properties:
        participantId:
          type: string
          format: uuid
        ready:
          type: boolean
        controllerEpoch:
          type: integer
          format: int64
          minimum: 1
    TableView:
      type: object
      additionalProperties: false
      required:
        - tableId
        - state
        - locked
        - revision
        - lastSeq
        - boardNumber
        - viewerParticipantId
        - viewerRole
        - participants
        - seats
      properties:
        tableId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/TableState"
        locked:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 0
        lastSeq:
          type: integer
          format: int64
          minimum: 0
        boardId:
          type: string
          format: uuid
        boardNumber:
          type: integer
          minimum: 0
        viewerParticipantId:
          type: string
          format: uuid
        viewerRole:
          $ref: "#/components/schemas/TableRole"
        viewerSeat:
          $ref: "#/components/schemas/TableSeat"
        participants:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/TableParticipant"
        seats:
          type: object
          maxProperties: 4
          additionalProperties:
            $ref: "#/components/schemas/TableSeatAssignment"
    CreateTableResponse:
      type: object
      additionalProperties: false
      required:
        - inviteCode
        - table
      properties:
        inviteCode:
          type: string
          minLength: 26
          maxLength: 26
          pattern: "^[A-Z2-7]+$"
        table:
          $ref: "#/components/schemas/TableView"
    TablePreview:
      type: object
      additionalProperties: false
      required:
        - state
        - locked
        - participantCount
        - capacity
      properties:
        state:
          $ref: "#/components/schemas/TableState"
        locked:
          type: boolean
        participantCount:
          type: integer
          minimum: 0
          maximum: 4
        capacity:
          type: integer
          minimum: 4
          maximum: 4
