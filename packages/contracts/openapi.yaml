openapi: 3.1.0
info:
  title: BridgeYok HTTP API
  version: 0.1.0
  description: Public HTTP contract for the BridgeYok service foundation.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /:
    get:
      operationId: getServiceInfo
      summary: Get API service information
      responses:
        "200":
          description: API is serving requests
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: bridgeyok-api
  /health/live:
    get:
      operationId: getLiveness
      summary: Check process liveness
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: api
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check database and migration readiness
      responses:
        "200":
          description: API dependencies are ready
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ready
                service: api
        "503":
          description: A required dependency is unavailable
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: unavailable
                service: api
  /v1/guest-sessions:
    post:
      operationId: createGuestSession
      summary: Create a device-scoped guest session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestSessionRequest"
      responses:
        "201":
          description: Guest session created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestCredentials"
        "400":
          $ref: "#/components/responses/ProblemResponse"
  /v1/guest-sessions/refresh:
    post:
      operationId: refreshGuestSession
      summary: Rotate a device credential and issue fresh access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshGuestSessionRequest"
      responses:
        "200":
          description: Guest credentials rotated
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestCredentials"
        "401":
          $ref: "#/components/responses/ProblemResponse"
  /v1/guest-sessions/current:
    delete:
      operationId: revokeGuestSession
      summary: Revoke the authenticated guest session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Guest session revoked
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables:
    post:
      operationId: createTable
      summary: Create a private waiting table
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Table created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTableResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables/{inviteCode}/preview:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    get:
      operationId: previewTable
      summary: Preview a private invite without joining
      responses:
        "200":
          description: Non-identifying table preview
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TablePreview"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables/{inviteCode}/join:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    post:
      operationId: joinTable
      summary: Join an available private table
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Participant joined or existing participation resumed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables/{tableId}:
    parameters:
      - $ref: "#/components/parameters/TableId"
    get:
      operationId: getTable
      summary: Get recipient-projected table state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authorized table state
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableView"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /v1/tables/{tableId}/leave:
    parameters:
      - $ref: "#/components/parameters/TableId"
    post:
      operationId: leaveTable
      summary: Leave a waiting table and release its seat
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Participant left the table
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /v1/realtime/tickets:
    post:
      operationId: createRealtimeTicket
      summary: Issue a single-use WebSocket ticket
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Realtime ticket issued
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTicket"
        "401":
          $ref: "#/components/responses/ProblemResponse"
  /v1/boards/{boardId}/analysis:
    get:
      operationId: analyzeCompletedBoard
      summary: Analyze a completed board for an active table participant
      description: Read-only DDS analysis. Historical boards created before source persistence return 404. No client-supplied deal is accepted.
      security:
        - bearerAuth: []
      parameters:
        - name: boardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dealer-aware double-dummy analysis
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardAnalysis"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
        "504":
          $ref: "#/components/responses/ProblemResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  headers:
    RequestId:
      description: Correlation identifier for the request.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9_-]+$"
  parameters:
    InviteCode:
      name: inviteCode
      in: path
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26
        pattern: "^[A-Za-z2-7]+$"
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ProblemResponse:
      description: The request was rejected
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    AnalysisStrain:
      type: string
      enum: [C, D, H, S, NT]
    AnalysisTricks:
      type: integer
      minimum: 0
      maximum: 13
    AnalysisHand:
      type: object
      additionalProperties: false
      required: [C, D, H, S, NT]
      properties:
        C:
          $ref: "#/components/schemas/AnalysisTricks"
        D:
          $ref: "#/components/schemas/AnalysisTricks"
        H:
          $ref: "#/components/schemas/AnalysisTricks"
        S:
          $ref: "#/components/schemas/AnalysisTricks"
        NT:
          $ref: "#/components/schemas/AnalysisTricks"
    AnalysisResult:
      type: object
      additionalProperties: false
      required: [solverVersion, doubleDummyTable, makeableContracts, par]
      properties:
        solverVersion:
          type: string
          const: dds-2.9.0-8d75755
        doubleDummyTable:
          type: object
          additionalProperties: false
          required: [N, E, S, W]
          properties:
            N:
              $ref: "#/components/schemas/AnalysisHand"
            E:
              $ref: "#/components/schemas/AnalysisHand"
            S:
              $ref: "#/components/schemas/AnalysisHand"
            W:
              $ref: "#/components/schemas/AnalysisHand"
        makeableContracts:
          type: array
          maxItems: 20
          description: Maximum makeable undoubled level for each declarer and strain that can take at least seven tricks.
          items:
            type: object
            additionalProperties: false
            required: [declarer, strain, level]
            properties:
              declarer:
                $ref: "#/components/schemas/TableSeat"
              strain:
                $ref: "#/components/schemas/AnalysisStrain"
              level:
                type: integer
                minimum: 1
                maximum: 7
        par:
          type: object
          additionalProperties: false
          required: [scoreNS, contracts]
          properties:
            scoreNS:
              type: integer
              minimum: -7600
              maximum: 7600
            contracts:
              type: array
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                required: [declarers, strain, level, overTricks, underTricks, doubled]
                properties:
                  declarers:
                    type: array
                    minItems: 1
                    maxItems: 2
                    uniqueItems: true
                    items:
                      $ref: "#/components/schemas/TableSeat"
                  strain:
                    $ref: "#/components/schemas/AnalysisStrain"
                  level:
                    type: integer
                    minimum: 1
                    maximum: 7
                  overTricks:
                    type: integer
                    minimum: 0
                    maximum: 6
                  underTricks:
                    type: integer
                    minimum: 0
                    maximum: 13
                  doubled:
                    type: boolean
    BoardAnalysis:
      type: object
      additionalProperties: false
      required: [boardId, metadata, provenance, analysis]
      properties:
        boardId:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: false
          required: [number, dealer, vulnerability]
          properties:
            number:
              type: integer
              minimum: 1
            dealer:
              $ref: "#/components/schemas/TableSeat"
            vulnerability:
              type: string
              enum: [NONE, NS, EW, BOTH]
        provenance:
          type: object
          additionalProperties: false
          required: [type, version]
          properties:
            type:
              type: string
              enum: [secure_random, deterministic, prepared, constraint]
            version:
              type: string
              minLength: 1
              maxLength: 64
            reference:
              type: string
              format: uuid
        analysis:
          $ref: "#/components/schemas/AnalysisResult"
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
            - ready
            - unavailable
        service:
          type: string
          minLength: 1
          maxLength: 64
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
          maxLength: 160
        status:
          type: integer
          minimum: 400
          maximum: 599
        requestId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Z][A-Z0-9_]*$"
        messageKey:
          type: string
          minLength: 1
          maxLength: 128
        retryable:
          type: boolean
    CreateGuestSessionRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 128
    RefreshGuestSessionRequest:
      type: object
      additionalProperties: false
      required:
        - deviceCredential
      properties:
        deviceCredential:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]+$"
    GuestCredentials:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - nickname
        - accessToken
        - accessExpiresAt
        - deviceCredential
      properties:
        sessionId:
          type: string
          format: uuid
        nickname:
          type: string
        accessToken:
          type: string
          minLength: 32
        accessExpiresAt:
          type: string
          format: date-time
        deviceCredential:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]+$"
    RealtimeTicket:
      type: object
      additionalProperties: false
      required:
        - ticket
        - expiresAt
      properties:
        ticket:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]+$"
        expiresAt:
          type: string
          format: date-time
    TableState:
      type: string
      enum:
        - WAITING
        - ACTIVE
        - BETWEEN_BOARDS
        - FINISHED
        - PAUSED
    TableRole:
      type: string
      enum:
        - OWNER
        - PARTICIPANT
    TableSeat:
      type: string
      enum:
        - N
        - E
        - S
        - W
    TableParticipant:
      type: object
      additionalProperties: false
      required:
        - id
        - nickname
        - role
        - isBot
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
          minLength: 2
          maxLength: 64
        role:
          $ref: "#/components/schemas/TableRole"
        isBot:
          type: boolean
    TableSeatAssignment:
      type: object
      additionalProperties: false
      required:
        - participantId
        - ready
        - controllerEpoch
      properties:
        participantId:
          type: string
          format: uuid
        ready:
          type: boolean
        controllerEpoch:
          type: integer
          format: int64
          minimum: 1
        isBot:
          type: boolean
    TableView:
      type: object
      additionalProperties: false
      required:
        - tableId
        - state
        - locked
        - revision
        - lastSeq
        - boardNumber
        - viewerParticipantId
        - viewerRole
        - participants
        - seats
      properties:
        tableId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/TableState"
        locked:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 0
        lastSeq:
          type: integer
          format: int64
          minimum: 0
        boardId:
          type: string
          format: uuid
        boardNumber:
          type: integer
          minimum: 0
        viewerParticipantId:
          type: string
          format: uuid
        viewerRole:
          $ref: "#/components/schemas/TableRole"
        viewerSeat:
          $ref: "#/components/schemas/TableSeat"
        participants:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/TableParticipant"
        seats:
          type: object
          maxProperties: 4
          additionalProperties:
            $ref: "#/components/schemas/TableSeatAssignment"
    CreateTableResponse:
      type: object
      additionalProperties: false
      required:
        - inviteCode
        - table
      properties:
        inviteCode:
          type: string
          minLength: 26
          maxLength: 26
          pattern: "^[A-Z2-7]+$"
        table:
          $ref: "#/components/schemas/TableView"
    TablePreview:
      type: object
      additionalProperties: false
      required:
        - state
        - locked
        - participantCount
        - capacity
      properties:
        state:
          $ref: "#/components/schemas/TableState"
        locked:
          type: boolean
        participantCount:
          type: integer
          minimum: 0
          maximum: 4
        capacity:
          type: integer
          minimum: 4
          maximum: 4
