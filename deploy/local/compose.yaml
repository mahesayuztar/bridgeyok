name: bridgeyok-local-gate

services:
  api:
    image: bridgeyok-api:${LOCAL_GATE_RELEASE:-current}
    build:
      context: ../..
      dockerfile: deploy/local/api.Dockerfile
      args:
        RELEASE_ID: ${LOCAL_GATE_RELEASE:-current}
    environment:
      ALLOWED_ORIGINS: https://bridgeyok.localhost:${LOCAL_GATE_HTTPS_PORT:-8443}
      API_HOST: 0.0.0.0
      APP_ENV: preview
      AUTH_SECRET: ${AUTH_SECRET:-local-gate-only-secret-change-before-public-use}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-4}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to the Supabase session pooler}
      IDLE_TIMEOUT: 60s
      LOG_LEVEL: info
      PORT: 8080
      READ_HEADER_TIMEOUT: 5s
      READ_TIMEOUT: 15s
      SHUTDOWN_TIMEOUT: 10s
      TABLE_ACTOR_IDLE_TIMEOUT: 10m
      TABLE_ACTOR_QUEUE_CAPACITY: 64
      REALTIME_READ_LIMIT_BYTES: 8192
      REALTIME_OUTBOUND_QUEUE_CAPACITY: 64
      REALTIME_OUTBOUND_QUEUE_BYTES: 262144
      REALTIME_WRITE_TIMEOUT: 5s
      REALTIME_PING_INTERVAL: 20s
      REALTIME_PONG_TIMEOUT: 10s
      REALTIME_MAX_CONNECTIONS: 256
      REALTIME_MAX_CONNECTIONS_PER_SESSION: 3
      REALTIME_MESSAGE_RATE: 10
      REALTIME_MESSAGE_BURST: 20
      REALTIME_RECOVERY_LIMIT: 128
      WRITE_TIMEOUT: 15s
    labels:
      io.bridgeyok.release: ${LOCAL_GATE_RELEASE:-current}
    init: true
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - gate

  wsprobe:
    image: bridgeyok-api:${LOCAL_GATE_RELEASE:-current}
    entrypoint:
      - /workspace/bin/wsprobe
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8090/health/live"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    environment:
      PORT: 8090
      WS_PROBE_ALLOWED_ORIGIN: https://bridgeyok.localhost:${LOCAL_GATE_HTTPS_PORT:-8443}
    labels:
      io.bridgeyok.release: ${LOCAL_GATE_RELEASE:-current}
    init: true
    networks:
      - gate

  web:
    image: bridgeyok-web:${LOCAL_GATE_RELEASE:-current}
    build:
      context: ../..
      dockerfile: deploy/local/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.bridgeyok.localhost:${LOCAL_GATE_HTTPS_PORT:-8443}
        RELEASE_ID: ${LOCAL_GATE_RELEASE:-current}
    environment:
      API_BASE_URL: http://api:8080
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    labels:
      io.bridgeyok.release: ${LOCAL_GATE_RELEASE:-current}
    init: true
    networks:
      - gate

  edge:
    image: caddy:2.11.4-alpine
    depends_on:
      - api
      - web
      - wsprobe
    ports:
      - 127.0.0.1:${LOCAL_GATE_HTTPS_PORT:-8443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      gate:
        aliases:
          - api.bridgeyok.localhost
          - bridgeyok.localhost

  wscheck:
    profiles:
      - tools
    image: bridgeyok-api:${LOCAL_GATE_RELEASE:-current}
    entrypoint:
      - /workspace/bin/wscheck
    environment:
      WS_CHECK_CA_FILE: /tmp/caddy-root.crt
      WS_CHECK_MODE: ${WS_CHECK_MODE:-echo}
      WS_CHECK_ORIGIN: ${WS_CHECK_ORIGIN:-https://bridgeyok.localhost:8443}
      WS_CHECK_URL: wss://api.bridgeyok.localhost/v1/ws
    networks:
      - gate

networks:
  gate:

volumes:
  caddy-config:
  caddy-data:
